apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_route_summary
  title: Juniper Junos — show route summary
  description: Deterministic synthetic, vendor-shaped response for show route summary on Juniper Junos; not captured
    output.
  license: Apache-2.0
  synthetic: true
  category: routes
spec:
  platform: juniper_junos
  platform_aliases:
  - junos
  - juniper-junos
  command: show route summary
  aliases:
  - sh route summary
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show route summary
    route_total:
      source: inventory.routes.total
    default_present:
      generator:
        name: yes_no
        source: inventory.routes.default_present
    stale:
      source: inventory.routes.stale
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}> ${command}
    ${records}
    Route summary: ${route_total} total, ${stale} stale
    Default route present: ${default_present}
  result_schema:
  - path: routes.total
    type: integer
    source: inventory.routes.total
  - path: routes.default_present
    type: boolean
    source: inventory.routes.default_present
  - path: routes.stale
    type: integer
    source: inventory.routes.stale
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-juniper-junos-01
      routes:
        total: 128
        default_present: true
        stale: 0
      display:
        records:
        - 'Autonomous system number: 65000'
        - 'Router ID: 203.0.113.11'
        - 'Highwater Mark (All time): 256 routes'
        - 'inet.0: 128 destinations, 256 routes (127 active, 0 holddown, 1 hidden)'
        - 'inet6.0: 32 destinations, 64 routes (32 active, 0 holddown, 0 hidden)'
    expected_output: |
      demo-juniper-junos-01> show route summary
      Autonomous system number: 65000
      Router ID: 203.0.113.11
      Highwater Mark (All time): 256 routes
      inet.0: 128 destinations, 256 routes (127 active, 0 holddown, 1 hidden)
      inet6.0: 32 destinations, 64 routes (32 active, 0 holddown, 0 hidden)
      Route summary: 128 total, 0 stale
      Default route present: yes
    expected_result:
      routes:
        total: 128
        default_present: true
        stale: 0
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-juniper-junos-01
      routes:
        total: 118
        default_present: false
        stale: 9
      display:
        records:
        - 'Autonomous system number: 65000'
        - 'Router ID: 203.0.113.11'
        - 'Highwater Mark (All time): 256 routes'
        - 'inet.0: 128 destinations, 256 routes (127 active, 0 holddown, 1 hidden)'
        - 'inet6.0: 32 destinations, 64 routes (32 active, 0 holddown, 0 hidden)'
    expected_output: |
      demo-juniper-junos-01> show route summary
      Autonomous system number: 65000
      Router ID: 203.0.113.11
      Highwater Mark (All time): 256 routes
      inet.0: 128 destinations, 256 routes (127 active, 0 holddown, 1 hidden)
      inet6.0: 32 destinations, 64 routes (32 active, 0 holddown, 0 hidden)
      Route summary: 118 total, 9 stale
      Default route present: no
    expected_result:
      routes:
        total: 118
        default_present: false
        stale: 9
