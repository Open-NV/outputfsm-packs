apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_bgp_summary
  title: Juniper Junos — show bgp summary
  description: Deterministic synthetic, vendor-shaped response for show bgp summary on Juniper Junos; not captured
    output.
  license: Apache-2.0
  synthetic: true
  category: routing_peers
spec:
  platform: juniper_junos
  platform_aliases:
  - junos
  - juniper-junos
  command: show bgp summary
  aliases:
  - sh bgp summary
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show bgp summary
    peers:
      source: inventory.routing.peers_total
    established:
      source: inventory.routing.peers_established
    ratio:
      generator:
        name: percent
        source: inventory.routing.established_ratio_pct
        precision: 1
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}> ${command}
    ${records}
    Peer summary: ${established}/${peers} established (${ratio})
  result_schema:
  - path: routing.peers_total
    type: integer
    source: inventory.routing.peers_total
  - path: routing.peers_established
    type: integer
    source: inventory.routing.peers_established
  - path: routing.established_ratio_pct
    type: number
    source: inventory.routing.established_ratio_pct
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-juniper-junos-01
      routing:
        peers_total: 8
        peers_established: 8
        established_ratio_pct: 100.0
      display:
        records:
        - 'Groups: 2 Peers: 8 Down peers: 0'
        - Table          Tot Paths  Act Paths Suppressed History Damp State Pending
        - inet.0               256        128          0       0    0          0
        - Peer               AS      InPkt     OutPkt    OutQ   Flaps Last Up/Dwn State|#Active/Received/Accepted/Damped...
        - 192.0.2.2       64512      88421      87112       0       0 2d 03:11:04 128/128/128/0
        - 198.51.100.2    64513      12004      11998       0       3 00:04:12 64/64/64/0
    expected_output: |
      demo-juniper-junos-01> show bgp summary
      Groups: 2 Peers: 8 Down peers: 0
      Table          Tot Paths  Act Paths Suppressed History Damp State Pending
      inet.0               256        128          0       0    0          0
      Peer               AS      InPkt     OutPkt    OutQ   Flaps Last Up/Dwn State|#Active/Received/Accepted/Damped...
      192.0.2.2       64512      88421      87112       0       0 2d 03:11:04 128/128/128/0
      198.51.100.2    64513      12004      11998       0       3 00:04:12 64/64/64/0
      Peer summary: 8/8 established (100.0%)
    expected_result:
      routing:
        peers_total: 8
        peers_established: 8
        established_ratio_pct: 100.0
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-juniper-junos-01
      routing:
        peers_total: 8
        peers_established: 5
        established_ratio_pct: 62.5
      display:
        records:
        - 'Groups: 2 Peers: 8 Down peers: 0'
        - Table          Tot Paths  Act Paths Suppressed History Damp State Pending
        - inet.0               256        128          0       0    0          0
        - Peer               AS      InPkt     OutPkt    OutQ   Flaps Last Up/Dwn State|#Active/Received/Accepted/Damped...
        - 192.0.2.2       64512      88421      87112       0       0 2d 03:11:04 128/128/128/0
        - 198.51.100.2    64513      12004      11998       0       3 00:04:12 Active
    expected_output: |
      demo-juniper-junos-01> show bgp summary
      Groups: 2 Peers: 8 Down peers: 0
      Table          Tot Paths  Act Paths Suppressed History Damp State Pending
      inet.0               256        128          0       0    0          0
      Peer               AS      InPkt     OutPkt    OutQ   Flaps Last Up/Dwn State|#Active/Received/Accepted/Damped...
      192.0.2.2       64512      88421      87112       0       0 2d 03:11:04 128/128/128/0
      198.51.100.2    64513      12004      11998       0       3 00:04:12 Active
      Peer summary: 5/8 established (62.5%)
    expected_result:
      routing:
        peers_total: 8
        peers_established: 5
        established_ratio_pct: 62.5
