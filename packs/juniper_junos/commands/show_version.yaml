apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_version
  title: Juniper Junos — show version
  description: Deterministic synthetic, vendor-shaped response for show version on Juniper Junos; not captured output.
  license: Apache-2.0
  synthetic: true
  category: system_version
spec:
  platform: juniper_junos
  platform_aliases:
  - junos
  - juniper-junos
  command: show version
  aliases:
  - sh version
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show version
    os_version:
      source: inventory.system.os_version
    image:
      source: inventory.system.image
    uptime:
      generator:
        name: uptime_human
        source: inventory.system.uptime_seconds
    oper_state:
      source: inventory.system.oper_state
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}> ${command}
    ${records}
    Software version: ${os_version}
    System image file: ${image}
    System uptime: ${uptime}
    Operating state: ${oper_state}
  result_schema:
  - path: system.os_version
    type: string
    source: inventory.system.os_version
  - path: system.image
    type: string
    source: inventory.system.image
  - path: system.uptime_seconds
    type: integer
    source: inventory.system.uptime_seconds
  - path: system.oper_state
    type: string
    source: inventory.system.oper_state
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-juniper-junos-01
      system:
        os_version: 24.2R1-open
        image: open-junos-install.tgz
        uptime_seconds: 987654
        oper_state: up
      display:
        records:
        - 'Model: mx204-synthetic'
        - 'Junos: synthetic'
        - JUNOS OS Kernel 64-bit [synthetic]
        - JUNOS network stack and utilities [synthetic]
        - JUNOS routing software suite [synthetic]
    expected_output: |
      demo-juniper-junos-01> show version
      Model: mx204-synthetic
      Junos: synthetic
      JUNOS OS Kernel 64-bit [synthetic]
      JUNOS network stack and utilities [synthetic]
      JUNOS routing software suite [synthetic]
      Software version: 24.2R1-open
      System image file: open-junos-install.tgz
      System uptime: 11d 10:20:54
      Operating state: up
    expected_result:
      system:
        os_version: 24.2R1-open
        image: open-junos-install.tgz
        uptime_seconds: 987654
        oper_state: up
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-juniper-junos-01
      system:
        os_version: 24.2R1-open
        image: open-junos-install.tgz
        uptime_seconds: 987654
        oper_state: down
      display:
        records:
        - 'Model: mx204-synthetic'
        - 'Junos: synthetic'
        - JUNOS OS Kernel 64-bit [synthetic]
        - JUNOS network stack and utilities [synthetic]
        - JUNOS routing software suite [synthetic]
    expected_output: |
      demo-juniper-junos-01> show version
      Model: mx204-synthetic
      Junos: synthetic
      JUNOS OS Kernel 64-bit [synthetic]
      JUNOS network stack and utilities [synthetic]
      JUNOS routing software suite [synthetic]
      Software version: 24.2R1-open
      System image file: open-junos-install.tgz
      System uptime: 11d 10:20:54
      Operating state: down
    expected_result:
      system:
        os_version: 24.2R1-open
        image: open-junos-install.tgz
        uptime_seconds: 987654
        oper_state: down
