apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_chassis_routing_engine
  title: Juniper Junos — show chassis routing-engine
  description: Deterministic synthetic, vendor-shaped response for show chassis routing-engine on Juniper Junos;
    not captured output.
  license: Apache-2.0
  synthetic: true
  category: redundancy
spec:
  platform: juniper_junos
  platform_aliases:
  - junos
  - juniper-junos
  command: show chassis routing-engine
  aliases:
  - sh chassis routing-engine
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show chassis routing-engine
    state:
      source: inventory.redundancy.state
    peer:
      source: inventory.redundancy.peer_state
    ready:
      generator:
        name: yes_no
        source: inventory.redundancy.ready
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}> ${command}
    ${records}
    Local state: ${state}
    Peer state: ${peer}
    Redundancy ready: ${ready}
  result_schema:
  - path: redundancy.state
    type: string
    source: inventory.redundancy.state
  - path: redundancy.peer_state
    type: string
    source: inventory.redundancy.peer_state
  - path: redundancy.ready
    type: boolean
    source: inventory.redundancy.ready
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-juniper-junos-01
      redundancy:
        state: active
        peer_state: standby-ready
        ready: true
      display:
        records:
        - 'Routing Engine status:'
        - '  Slot 0:'
        - '    Current state                  Master'
        - '    Election priority              Master (default)'
        - '  Slot 1:'
        - '    Current state                  Backup'
        - '    Redundancy state               Ready'
    expected_output: |
      demo-juniper-junos-01> show chassis routing-engine
      Routing Engine status:
        Slot 0:
          Current state                  Master
          Election priority              Master (default)
        Slot 1:
          Current state                  Backup
          Redundancy state               Ready
      Local state: active
      Peer state: standby-ready
      Redundancy ready: yes
    expected_result:
      redundancy:
        state: active
        peer_state: standby-ready
        ready: true
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-juniper-junos-01
      redundancy:
        state: active
        peer_state: standby-cold
        ready: false
      display:
        records:
        - 'Routing Engine status:'
        - '  Slot 0:'
        - '    Current state                  Master'
        - '    Election priority              Master (default)'
        - '  Slot 1:'
        - '    Current state                  Present'
        - '    Redundancy state               Not ready'
    expected_output: |
      demo-juniper-junos-01> show chassis routing-engine
      Routing Engine status:
        Slot 0:
          Current state                  Master
          Election priority              Master (default)
        Slot 1:
          Current state                  Present
          Redundancy state               Not ready
      Local state: active
      Peer state: standby-cold
      Redundancy ready: no
    expected_result:
      redundancy:
        state: active
        peer_state: standby-cold
        ready: false
