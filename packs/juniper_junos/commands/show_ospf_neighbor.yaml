apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_ospf_neighbor
  title: Juniper Junos — show ospf neighbor
  description: Deterministic synthetic, vendor-shaped response for show ospf neighbor on Juniper Junos; not captured
    output.
  license: Apache-2.0
  synthetic: true
  category: routing_peers
spec:
  platform: juniper_junos
  platform_aliases:
  - junos
  - juniper-junos
  command: show ospf neighbor
  aliases:
  - sh ospf neighbor
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show ospf neighbor
    peers:
      source: inventory.routing.peers_total
    established:
      source: inventory.routing.peers_established
    ratio:
      generator:
        name: percent
        source: inventory.routing.established_ratio_pct
        precision: 1
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}> ${command}
    ${records}
    Peer summary: ${established}/${peers} established (${ratio})
  result_schema:
  - path: routing.peers_total
    type: integer
    source: inventory.routing.peers_total
  - path: routing.peers_established
    type: integer
    source: inventory.routing.peers_established
  - path: routing.established_ratio_pct
    type: number
    source: inventory.routing.established_ratio_pct
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-juniper-junos-01
      routing:
        peers_total: 8
        peers_established: 8
        established_ratio_pct: 100.0
      display:
        records:
        - Address          Interface              State     ID               Pri  Dead
        - 192.0.2.2        ge-0/0/0.0             Full      203.0.113.2        128    33
        - 198.51.100.2     ge-0/0/1.0             Full     203.0.113.3        128    31
        - 10.0.0.2         irb.100                Full      203.0.113.4        128    36
        - OSPF instance master, area 0.0.0.0
    expected_output: |
      demo-juniper-junos-01> show ospf neighbor
      Address          Interface              State     ID               Pri  Dead
      192.0.2.2        ge-0/0/0.0             Full      203.0.113.2        128    33
      198.51.100.2     ge-0/0/1.0             Full     203.0.113.3        128    31
      10.0.0.2         irb.100                Full      203.0.113.4        128    36
      OSPF instance master, area 0.0.0.0
      Peer summary: 8/8 established (100.0%)
    expected_result:
      routing:
        peers_total: 8
        peers_established: 8
        established_ratio_pct: 100.0
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-juniper-junos-01
      routing:
        peers_total: 8
        peers_established: 5
        established_ratio_pct: 62.5
      display:
        records:
        - Address          Interface              State     ID               Pri  Dead
        - 192.0.2.2        ge-0/0/0.0             Full      203.0.113.2        128    33
        - 198.51.100.2     ge-0/0/1.0             ExStart  203.0.113.3        128    31
        - 10.0.0.2         irb.100                Full      203.0.113.4        128    36
        - OSPF instance master, area 0.0.0.0
    expected_output: |
      demo-juniper-junos-01> show ospf neighbor
      Address          Interface              State     ID               Pri  Dead
      192.0.2.2        ge-0/0/0.0             Full      203.0.113.2        128    33
      198.51.100.2     ge-0/0/1.0             ExStart  203.0.113.3        128    31
      10.0.0.2         irb.100                Full      203.0.113.4        128    36
      OSPF instance master, area 0.0.0.0
      Peer summary: 5/8 established (62.5%)
    expected_result:
      routing:
        peers_total: 8
        peers_established: 5
        established_ratio_pct: 62.5
