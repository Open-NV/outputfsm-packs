apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_lldp_neighbors_detail
  title: Juniper Junos — show lldp neighbors detail
  description: Deterministic synthetic, vendor-shaped response for show lldp neighbors detail on Juniper Junos;
    not captured output.
  license: Apache-2.0
  synthetic: true
  category: neighbors
spec:
  platform: juniper_junos
  platform_aliases:
  - junos
  - juniper-junos
  command: show lldp neighbors detail
  aliases:
  - sh lldp neighbors detail
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show lldp neighbors detail
    count:
      source: inventory.neighbors.count
    expected:
      source: inventory.neighbors.expected_count
    expected_matches:
      generator:
        name: yes_no
        source: inventory.neighbors.expected_matches
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}> ${command}
    ${records}
    Total entries displayed: ${count}
    Expected entries: ${expected}
    Expected set matched: ${expected_matches}
  result_schema:
  - path: neighbors.count
    type: integer
    source: inventory.neighbors.count
  - path: neighbors.expected_count
    type: integer
    source: inventory.neighbors.expected_count
  - path: neighbors.expected_matches
    type: boolean
    source: inventory.neighbors.expected_matches
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-juniper-junos-01
      neighbors:
        count: 6
        expected_count: 6
        expected_matches: true
      display:
        records:
        - Local interface    Parent interface    Chassis Id          Port info          System Name
        - ge-0/0/0           -                   02:00:00:00:70:01 Ethernet49         leaf-02
        - ge-0/0/1           -                   02:00:00:00:70:02 Ethernet1          border-01
        - 'Neighbor detail:'
        - '  Management address: 192.0.2.22, System capabilities: Bridge Router'
        - '  Port description: synthetic fabric uplink'
    expected_output: |
      demo-juniper-junos-01> show lldp neighbors detail
      Local interface    Parent interface    Chassis Id          Port info          System Name
      ge-0/0/0           -                   02:00:00:00:70:01 Ethernet49         leaf-02
      ge-0/0/1           -                   02:00:00:00:70:02 Ethernet1          border-01
      Neighbor detail:
        Management address: 192.0.2.22, System capabilities: Bridge Router
        Port description: synthetic fabric uplink
      Total entries displayed: 6
      Expected entries: 6
      Expected set matched: yes
    expected_result:
      neighbors:
        count: 6
        expected_count: 6
        expected_matches: true
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-juniper-junos-01
      neighbors:
        count: 4
        expected_count: 6
        expected_matches: false
      display:
        records:
        - Local interface    Parent interface    Chassis Id          Port info          System Name
        - ge-0/0/0           -                   02:00:00:00:70:01 Ethernet49         leaf-02
        - ge-0/0/1           -                   02:00:00:00:70:02 Ethernet1          unknown
        - 'Neighbor detail:'
        - '  Management address: 192.0.2.22, System capabilities: Bridge Router'
        - '  Port description: synthetic fabric uplink'
    expected_output: |
      demo-juniper-junos-01> show lldp neighbors detail
      Local interface    Parent interface    Chassis Id          Port info          System Name
      ge-0/0/0           -                   02:00:00:00:70:01 Ethernet49         leaf-02
      ge-0/0/1           -                   02:00:00:00:70:02 Ethernet1          unknown
      Neighbor detail:
        Management address: 192.0.2.22, System capabilities: Bridge Router
        Port description: synthetic fabric uplink
      Total entries displayed: 4
      Expected entries: 6
      Expected set matched: no
    expected_result:
      neighbors:
        count: 4
        expected_count: 6
        expected_matches: false
