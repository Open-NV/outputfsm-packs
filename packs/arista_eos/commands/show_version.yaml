apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_version
  title: Arista EOS — show version
  description: Deterministic synthetic, vendor-shaped response for show version on Arista EOS; not captured output.
  license: Apache-2.0
  synthetic: true
  category: system_version
spec:
  platform: arista_eos
  platform_aliases:
  - eos
  - arista-eos
  command: show version
  aliases:
  - sh version
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show version
    os_version:
      source: inventory.system.os_version
    image:
      source: inventory.system.image
    uptime:
      generator:
        name: uptime_human
        source: inventory.system.uptime_seconds
    oper_state:
      source: inventory.system.oper_state
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}#${command}
    ${records}
    Software version: ${os_version}
    System image file: ${image}
    System uptime: ${uptime}
    Operating state: ${oper_state}
  result_schema:
  - path: system.os_version
    type: string
    source: inventory.system.os_version
  - path: system.image
    type: string
    source: inventory.system.image
  - path: system.uptime_seconds
    type: integer
    source: inventory.system.uptime_seconds
  - path: system.oper_state
    type: string
    source: inventory.system.oper_state
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-arista-eos-01
      system:
        os_version: 4.32.1F-open
        image: flash:/open-eos-image.swi
        uptime_seconds: 987654
        oper_state: up
      display:
        records:
        - Arista synthetic DCS-7280 platform
        - 'Hardware version: 01.00'
        - 'Serial number: OPENNV-EOS-0001'
        - 'System MAC address: 02:00:00:00:00:51'
        - 'Total memory: 8096000 kB'
    expected_output: |
      demo-arista-eos-01#show version
      Arista synthetic DCS-7280 platform
      Hardware version: 01.00
      Serial number: OPENNV-EOS-0001
      System MAC address: 02:00:00:00:00:51
      Total memory: 8096000 kB
      Software version: 4.32.1F-open
      System image file: flash:/open-eos-image.swi
      System uptime: 11d 10:20:54
      Operating state: up
    expected_result:
      system:
        os_version: 4.32.1F-open
        image: flash:/open-eos-image.swi
        uptime_seconds: 987654
        oper_state: up
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-arista-eos-01
      system:
        os_version: 4.32.1F-open
        image: flash:/open-eos-image.swi
        uptime_seconds: 987654
        oper_state: down
      display:
        records:
        - Arista synthetic DCS-7280 platform
        - 'Hardware version: 01.00'
        - 'Serial number: OPENNV-EOS-0001'
        - 'System MAC address: 02:00:00:00:00:51'
        - 'Total memory: 8096000 kB'
    expected_output: |
      demo-arista-eos-01#show version
      Arista synthetic DCS-7280 platform
      Hardware version: 01.00
      Serial number: OPENNV-EOS-0001
      System MAC address: 02:00:00:00:00:51
      Total memory: 8096000 kB
      Software version: 4.32.1F-open
      System image file: flash:/open-eos-image.swi
      System uptime: 11d 10:20:54
      Operating state: down
    expected_result:
      system:
        os_version: 4.32.1F-open
        image: flash:/open-eos-image.swi
        uptime_seconds: 987654
        oper_state: down
