apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_vlan
  title: Arista EOS — show vlan
  description: Deterministic synthetic, vendor-shaped response for show vlan on Arista EOS; not captured output.
  license: Apache-2.0
  synthetic: true
  category: vlans
spec:
  platform: arista_eos
  platform_aliases:
  - eos
  - arista-eos
  command: show vlan
  aliases:
  - sh vlan
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show vlan
    total:
      source: inventory.vlans.total
    active:
      source: inventory.vlans.active
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}#${command}
    ${records}
    VLAN summary: ${total} defined, ${active} active
  result_schema:
  - path: vlans.total
    type: integer
    source: inventory.vlans.total
  - path: vlans.active
    type: integer
    source: inventory.vlans.active
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-arista-eos-01
      vlans:
        total: 24
        active: 24
      display:
        records:
        - VLAN Name                             Status    Ports
        - '---- -------------------------------- --------- -------------------------------'
        - 100  server-vlan                      active   Eth1, Eth2, Po10
        - 200  storage-vlan                     active   Eth3, Eth4, Po20
        - 300  monitor-vlan                     active   Eth5
    expected_output: |
      demo-arista-eos-01#show vlan
      VLAN Name                             Status    Ports
      ---- -------------------------------- --------- -------------------------------
      100  server-vlan                      active   Eth1, Eth2, Po10
      200  storage-vlan                     active   Eth3, Eth4, Po20
      300  monitor-vlan                     active   Eth5
      VLAN summary: 24 defined, 24 active
    expected_result:
      vlans:
        total: 24
        active: 24
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-arista-eos-01
      vlans:
        total: 24
        active: 0
      display:
        records:
        - VLAN Name                             Status    Ports
        - '---- -------------------------------- --------- -------------------------------'
        - 100  server-vlan                      suspendednone
        - 200  storage-vlan                     suspendednone
        - 300  monitor-vlan                     suspendedEth5
    expected_output: |
      demo-arista-eos-01#show vlan
      VLAN Name                             Status    Ports
      ---- -------------------------------- --------- -------------------------------
      100  server-vlan                      suspendednone
      200  storage-vlan                     suspendednone
      300  monitor-vlan                     suspendedEth5
      VLAN summary: 24 defined, 0 active
    expected_result:
      vlans:
        total: 24
        active: 0
