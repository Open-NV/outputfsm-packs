apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_ip_ospf_neighbor
  title: Cisco IOS XE — show ip ospf neighbor
  description: Deterministic synthetic, vendor-shaped response for show ip ospf neighbor on Cisco IOS XE; not captured
    output.
  license: Apache-2.0
  synthetic: true
  category: routing_peers
spec:
  platform: cisco_iosxe
  platform_aliases:
  - iosxe
  - ios-xe
  - cisco-ios-xe
  command: show ip ospf neighbor
  aliases:
  - sh ip ospf neighbor
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show ip ospf neighbor
    peers:
      source: inventory.routing.peers_total
    established:
      source: inventory.routing.peers_established
    ratio:
      generator:
        name: percent
        source: inventory.routing.established_ratio_pct
        precision: 1
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}#${command}
    ${records}
    Peer summary: ${established}/${peers} established (${ratio})
  result_schema:
  - path: routing.peers_total
    type: integer
    source: inventory.routing.peers_total
  - path: routing.peers_established
    type: integer
    source: inventory.routing.peers_established
  - path: routing.established_ratio_pct
    type: number
    source: inventory.routing.established_ratio_pct
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-cisco-iosxe-01
      routing:
        peers_total: 8
        peers_established: 8
        established_ratio_pct: 100.0
      display:
        records:
        - Neighbor ID     Pri   State           Dead Time   Address         Interface
        - 203.0.113.2       1   FULL/DR         00:00:33    192.0.2.2       Ethernet1
        - 203.0.113.3       1   FULL/BDR        00:00:31    198.51.100.2    Ethernet2
        - 203.0.113.4       1   FULL/DROTHER    00:00:36    10.0.0.2        Vlan100
        - Process 1, area 0.0.0.0, hello 10, dead 40
    expected_output: |
      demo-cisco-iosxe-01#show ip ospf neighbor
      Neighbor ID     Pri   State           Dead Time   Address         Interface
      203.0.113.2       1   FULL/DR         00:00:33    192.0.2.2       Ethernet1
      203.0.113.3       1   FULL/BDR        00:00:31    198.51.100.2    Ethernet2
      203.0.113.4       1   FULL/DROTHER    00:00:36    10.0.0.2        Vlan100
      Process 1, area 0.0.0.0, hello 10, dead 40
      Peer summary: 8/8 established (100.0%)
    expected_result:
      routing:
        peers_total: 8
        peers_established: 8
        established_ratio_pct: 100.0
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-cisco-iosxe-01
      routing:
        peers_total: 8
        peers_established: 5
        established_ratio_pct: 62.5
      display:
        records:
        - Neighbor ID     Pri   State           Dead Time   Address         Interface
        - 203.0.113.2       1   FULL/DR         00:00:33    192.0.2.2       Ethernet1
        - 203.0.113.3       1   EXSTART/DR      00:00:31    198.51.100.2    Ethernet2
        - 203.0.113.4       1   FULL/DROTHER    00:00:36    10.0.0.2        Vlan100
        - Process 1, area 0.0.0.0, hello 10, dead 40
    expected_output: |
      demo-cisco-iosxe-01#show ip ospf neighbor
      Neighbor ID     Pri   State           Dead Time   Address         Interface
      203.0.113.2       1   FULL/DR         00:00:33    192.0.2.2       Ethernet1
      203.0.113.3       1   EXSTART/DR      00:00:31    198.51.100.2    Ethernet2
      203.0.113.4       1   FULL/DROTHER    00:00:36    10.0.0.2        Vlan100
      Process 1, area 0.0.0.0, hello 10, dead 40
      Peer summary: 5/8 established (62.5%)
    expected_result:
      routing:
        peers_total: 8
        peers_established: 5
        established_ratio_pct: 62.5
