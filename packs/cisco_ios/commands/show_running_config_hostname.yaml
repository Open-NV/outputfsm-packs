apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_running_config_hostname
  title: Cisco IOS — show running-config | include hostname
  description: Deterministic synthetic, vendor-shaped response for show running-config | include hostname on Cisco
    IOS; not captured output.
  license: Apache-2.0
  synthetic: true
  category: config_state
spec:
  platform: cisco_ios
  platform_aliases:
  - ios
  - cisco-ios
  command: show running-config | include hostname
  aliases:
  - sh running-config | include hostname
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show running-config | include hostname
    clean:
      generator:
        name: yes_no
        source: inventory.config.clean
    change:
      source: inventory.config.last_change_id
    age:
      source: inventory.config.age_minutes
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}#${command}
    ${records}
    Configuration clean: ${clean}
    Last change: ${change}
    Configuration age: ${age} minutes
  result_schema:
  - path: config.clean
    type: boolean
    source: inventory.config.clean
  - path: config.last_change_id
    type: string
    source: inventory.config.last_change_id
  - path: config.age_minutes
    type: integer
    source: inventory.config.age_minutes
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-cisco-ios-01
      config:
        clean: true
        last_change_id: demo-change-0042
        age_minutes: 19
      display:
        records:
        - Building configuration...
        - 'Current configuration : 42 bytes'
        - '!'
        - hostname demo-cisco-ios-01
        - '!'
        - end
    expected_output: |
      demo-cisco-ios-01#show running-config | include hostname
      Building configuration...
      Current configuration : 42 bytes
      !
      hostname demo-cisco-ios-01
      !
      end
      Configuration clean: yes
      Last change: demo-change-0042
      Configuration age: 19 minutes
    expected_result:
      config:
        clean: true
        last_change_id: demo-change-0042
        age_minutes: 19
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-cisco-ios-01
      config:
        clean: false
        last_change_id: demo-change-pending
        age_minutes: 2
      display:
        records:
        - Building configuration...
        - 'Current configuration : 42 bytes'
        - '!'
        - hostname demo-cisco-ios-01
        - '!'
        - end
    expected_output: |
      demo-cisco-ios-01#show running-config | include hostname
      Building configuration...
      Current configuration : 42 bytes
      !
      hostname demo-cisco-ios-01
      !
      end
      Configuration clean: no
      Last change: demo-change-pending
      Configuration age: 2 minutes
    expected_result:
      config:
        clean: false
        last_change_id: demo-change-pending
        age_minutes: 2
