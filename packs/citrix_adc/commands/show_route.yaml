apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_route
  title: Citrix ADC / NetScaler — show route
  description: Deterministic synthetic, vendor-shaped response for show route on Citrix ADC / NetScaler; not captured
    output.
  license: Apache-2.0
  synthetic: true
  category: routes
spec:
  platform: citrix_adc
  platform_aliases:
  - citrix
  - netscaler
  - citrix-adc
  command: show route
  aliases:
  - sh route
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show route
    route_total:
      source: inventory.routes.total
    default_present:
      generator:
        name: yes_no
        source: inventory.routes.default_present
    stale:
      source: inventory.routes.stale
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    > ${command}
    ${records}
    Route summary: ${route_total} total, ${stale} stale
    Default route present: ${default_present}
  result_schema:
  - path: routes.total
    type: integer
    source: inventory.routes.total
  - path: routes.default_present
    type: boolean
    source: inventory.routes.default_present
  - path: routes.stale
    type: integer
    source: inventory.routes.stale
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-citrix-adc-01
      routes:
        total: 128
        default_present: true
        stale: 0
      display:
        records:
        - Network          Netmask          Gateway        Type   State
        - 0.0.0.0          0.0.0.0          192.0.2.254    STATIC UP
        - 10.0.0.0         255.255.255.0    10.0.0.1       DIRECT UP
        - 198.51.100.0     255.255.255.0    192.0.2.253    STATIC UP
        - Done
    expected_output: |
      > show route
      Network          Netmask          Gateway        Type   State
      0.0.0.0          0.0.0.0          192.0.2.254    STATIC UP
      10.0.0.0         255.255.255.0    10.0.0.1       DIRECT UP
      198.51.100.0     255.255.255.0    192.0.2.253    STATIC UP
      Done
      Route summary: 128 total, 0 stale
      Default route present: yes
    expected_result:
      routes:
        total: 128
        default_present: true
        stale: 0
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-citrix-adc-01
      routes:
        total: 118
        default_present: false
        stale: 9
      display:
        records:
        - Network          Netmask          Gateway        Type   State
        - 0.0.0.0          0.0.0.0          -              STATIC MISSING
        - 10.0.0.0         255.255.255.0    10.0.0.1       DIRECT UP
        - 198.51.100.0     255.255.255.0    192.0.2.253    STATIC DOWN
        - Done
    expected_output: |
      > show route
      Network          Netmask          Gateway        Type   State
      0.0.0.0          0.0.0.0          -              STATIC MISSING
      10.0.0.0         255.255.255.0    10.0.0.1       DIRECT UP
      198.51.100.0     255.255.255.0    192.0.2.253    STATIC DOWN
      Done
      Route summary: 118 total, 9 stale
      Default route present: no
    expected_result:
      routes:
        total: 118
        default_present: false
        stale: 9
