apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_server
  title: Citrix ADC / NetScaler — show server
  description: Deterministic synthetic, vendor-shaped response for show server on Citrix ADC / NetScaler; not captured
    output.
  license: Apache-2.0
  synthetic: true
  category: lb_server
spec:
  platform: citrix_adc
  platform_aliases:
  - citrix
  - netscaler
  - citrix-adc
  command: show server
  aliases:
  - sh server
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show server
    servers:
      source: inventory.load_balancing.servers
    up:
      source: inventory.load_balancing.servers_up
    down:
      source: inventory.load_balancing.servers_down
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    > ${command}
    ${records}
    Server summary: ${up}/${servers} up, ${down} down
  result_schema:
  - path: load_balancing.servers
    type: integer
    source: inventory.load_balancing.servers
  - path: load_balancing.servers_up
    type: integer
    source: inventory.load_balancing.servers_up
  - path: load_balancing.servers_down
    type: integer
    source: inventory.load_balancing.servers_down
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-citrix-adc-01
      load_balancing:
        servers: 20
        servers_up: 20
        servers_down: 0
      display:
        records:
        - 1) server app-node-01 10.0.0.20
        - '   State: UP, Effective State: UP'
        - '   Health: 100, Monitor State: UP'
        - 2) synthetic secondary object
        - '   State: UP, Effective State: UP, Health: 100'
        - Done
    expected_output: |
      > show server
      1) server app-node-01 10.0.0.20
         State: UP, Effective State: UP
         Health: 100, Monitor State: UP
      2) synthetic secondary object
         State: UP, Effective State: UP, Health: 100
      Done
      Server summary: 20/20 up, 0 down
    expected_result:
      load_balancing:
        servers: 20
        servers_up: 20
        servers_down: 0
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-citrix-adc-01
      load_balancing:
        servers: 20
        servers_up: 16
        servers_down: 4
      display:
        records:
        - 1) server app-node-01 10.0.0.20
        - '   State: DOWN, Effective State: DOWN'
        - '   Health: 0, Monitor State: FAILED'
        - 2) synthetic secondary object
        - '   State: UP, Effective State: UP, Health: 100'
        - Done
    expected_output: |
      > show server
      1) server app-node-01 10.0.0.20
         State: DOWN, Effective State: DOWN
         Health: 0, Monitor State: FAILED
      2) synthetic secondary object
         State: UP, Effective State: UP, Health: 100
      Done
      Server summary: 16/20 up, 4 down
    expected_result:
      load_balancing:
        servers: 20
        servers_up: 16
        servers_down: 4
