apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: stat_lb_vserver
  title: Citrix ADC / NetScaler — stat lb vserver
  description: Deterministic synthetic, vendor-shaped response for stat lb vserver on Citrix ADC / NetScaler; not
    captured output.
  license: Apache-2.0
  synthetic: true
  category: lb_virtual
spec:
  platform: citrix_adc
  platform_aliases:
  - citrix
  - netscaler
  - citrix-adc
  command: stat lb vserver
  aliases:
  - stat lb vserver -fullValues
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: stat lb vserver
    virtuals:
      source: inventory.load_balancing.virtual_servers
    available:
      source: inventory.load_balancing.virtual_servers_available
    unavailable:
      source: inventory.load_balancing.virtual_servers_unavailable
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    > ${command}
    ${records}
    Virtual server summary: ${available}/${virtuals} available, ${unavailable} unavailable
  result_schema:
  - path: load_balancing.virtual_servers
    type: integer
    source: inventory.load_balancing.virtual_servers
  - path: load_balancing.virtual_servers_available
    type: integer
    source: inventory.load_balancing.virtual_servers_available
  - path: load_balancing.virtual_servers_unavailable
    type: integer
    source: inventory.load_balancing.virtual_servers_unavailable
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-citrix-adc-01
      load_balancing:
        virtual_servers: 12
        virtual_servers_available: 12
        virtual_servers_unavailable: 0
      display:
        records:
        - Virtual Server   State  Requests  Responses  Current Clients  SurgeQ
        - app-primary      UP    1284231   1284202    1842             0
        - app-secondary    UP    884201    884190     921              0
        - api-primary      UP    422109    422100     438              0
        - Done
    expected_output: |
      > stat lb vserver
      Virtual Server   State  Requests  Responses  Current Clients  SurgeQ
      app-primary      UP    1284231   1284202    1842             0
      app-secondary    UP    884201    884190     921              0
      api-primary      UP    422109    422100     438              0
      Done
      Virtual server summary: 12/12 available, 0 unavailable
    expected_result:
      load_balancing:
        virtual_servers: 12
        virtual_servers_available: 12
        virtual_servers_unavailable: 0
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-citrix-adc-01
      load_balancing:
        virtual_servers: 12
        virtual_servers_available: 9
        virtual_servers_unavailable: 3
      display:
        records:
        - Virtual Server   State  Requests  Responses  Current Clients  SurgeQ
        - app-primary      DOWN  1284231   1284202    1842             48
        - app-secondary    UP    884201    884190     921              0
        - api-primary      UP    422109    422100     438              0
        - Done
    expected_output: |
      > stat lb vserver
      Virtual Server   State  Requests  Responses  Current Clients  SurgeQ
      app-primary      DOWN  1284231   1284202    1842             48
      app-secondary    UP    884201    884190     921              0
      api-primary      UP    422109    422100     438              0
      Done
      Virtual server summary: 9/12 available, 3 unavailable
    expected_result:
      load_balancing:
        virtual_servers: 12
        virtual_servers_available: 9
        virtual_servers_unavailable: 3
