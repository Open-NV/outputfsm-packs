apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_checkpoint_summary
  title: Cisco NX-OS — show checkpoint summary
  description: Deterministic synthetic, vendor-shaped response for show checkpoint summary on Cisco NX-OS; not captured
    output.
  license: Apache-2.0
  synthetic: true
  category: config_state
spec:
  platform: cisco_nxos
  platform_aliases:
  - nxos
  - nx-os
  - cisco-nxos
  command: show checkpoint summary
  aliases:
  - sh checkpoint summary
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show checkpoint summary
    clean:
      generator:
        name: yes_no
        source: inventory.config.clean
    change:
      source: inventory.config.last_change_id
    age:
      source: inventory.config.age_minutes
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}# ${command}
    ${records}
    Configuration clean: ${clean}
    Last change: ${change}
    Configuration age: ${age} minutes
  result_schema:
  - path: config.clean
    type: boolean
    source: inventory.config.clean
  - path: config.last_change_id
    type: string
    source: inventory.config.last_change_id
  - path: config.age_minutes
    type: integer
    source: inventory.config.age_minutes
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-cisco-nxos-01
      config:
        clean: true
        last_change_id: demo-change-0042
        age_minutes: 19
      display:
        records:
        - Checkpoint Summary
        - Name                         Created by       Created at             Status
        - baseline-20260816            opennv-fixture   2026-08-16 06:40:00    complete
        - candidate-20260816           opennv-fixture   2026-08-16 06:58:00    complete
        - 'Rollback required: no'
    expected_output: |
      demo-cisco-nxos-01# show checkpoint summary
      Checkpoint Summary
      Name                         Created by       Created at             Status
      baseline-20260816            opennv-fixture   2026-08-16 06:40:00    complete
      candidate-20260816           opennv-fixture   2026-08-16 06:58:00    complete
      Rollback required: no
      Configuration clean: yes
      Last change: demo-change-0042
      Configuration age: 19 minutes
    expected_result:
      config:
        clean: true
        last_change_id: demo-change-0042
        age_minutes: 19
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-cisco-nxos-01
      config:
        clean: false
        last_change_id: demo-change-pending
        age_minutes: 2
      display:
        records:
        - Checkpoint Summary
        - Name                         Created by       Created at             Status
        - baseline-20260816            opennv-fixture   2026-08-16 06:40:00    complete
        - candidate-20260816           opennv-fixture   2026-08-16 06:58:00    pending
        - 'Rollback required: yes'
    expected_output: |
      demo-cisco-nxos-01# show checkpoint summary
      Checkpoint Summary
      Name                         Created by       Created at             Status
      baseline-20260816            opennv-fixture   2026-08-16 06:40:00    complete
      candidate-20260816           opennv-fixture   2026-08-16 06:58:00    pending
      Rollback required: yes
      Configuration clean: no
      Last change: demo-change-pending
      Configuration age: 2 minutes
    expected_result:
      config:
        clean: false
        last_change_id: demo-change-pending
        age_minutes: 2
