id: cisco_nxos
name: Cisco NX-OS
aliases:
- nxos
- nx-os
- cisco-nxos
commands:
- id: show_version
  command: show version
  aliases:
  - sh version
  definition: packs/cisco_nxos/commands/show_version.yaml
  result_paths:
  - system.os_version
  - system.image
  - system.uptime_seconds
  - system.oper_state
  validation_hint:
    path: system.oper_state
    operator: eq
    expected: up
    failure_example: down
- id: show_interface_brief
  command: show interface brief
  aliases:
  - sh interface brief
  definition: packs/cisco_nxos/commands/show_interface_brief.yaml
  result_paths:
  - interfaces.total
  - interfaces.up
  - interfaces.down
  validation_hint:
    path: interfaces.down
    operator: lte
    expected: 1
    failure_example: 6
- id: show_interface
  command: show interface
  aliases:
  - sh interface
  definition: packs/cisco_nxos/commands/show_interface.yaml
  result_paths:
  - interfaces.error_count
  - interfaces.utilization_pct
  - interfaces.mtu
  validation_hint:
    path: interfaces.error_count
    operator: lte
    expected: 0
    failure_example: 14
- id: show_ip_route_vrf_all
  command: show ip route vrf all
  aliases:
  - sh ip route vrf all
  definition: packs/cisco_nxos/commands/show_ip_route_vrf_all.yaml
  result_paths:
  - routes.total
  - routes.default_present
  - routes.stale
  validation_hint:
    path: routes.default_present
    operator: eq
    expected: true
    failure_example: false
- id: show_ip_arp_vrf_all
  command: show ip arp vrf all
  aliases:
  - sh ip arp vrf all
  definition: packs/cisco_nxos/commands/show_ip_arp_vrf_all.yaml
  result_paths:
  - arp.entries
  - arp.incomplete
  validation_hint:
    path: arp.incomplete
    operator: eq
    expected: 0
    failure_example: 5
- id: show_mac_address_table
  command: show mac address-table
  aliases:
  - sh mac address-table
  definition: packs/cisco_nxos/commands/show_mac_address_table.yaml
  result_paths:
  - mac.entries
  - mac.dynamic
  validation_hint:
    path: mac.entries
    operator: gte
    expected: 1
    failure_example: 0
- id: show_lldp_neighbors_detail
  command: show lldp neighbors detail
  aliases:
  - sh lldp neighbors detail
  definition: packs/cisco_nxos/commands/show_lldp_neighbors_detail.yaml
  result_paths:
  - neighbors.count
  - neighbors.expected_count
  - neighbors.expected_matches
  validation_hint:
    path: neighbors.expected_matches
    operator: eq
    expected: true
    failure_example: false
- id: show_vlan_brief
  command: show vlan brief
  aliases:
  - sh vlan brief
  definition: packs/cisco_nxos/commands/show_vlan_brief.yaml
  result_paths:
  - vlans.total
  - vlans.active
  validation_hint:
    path: vlans.active
    operator: gte
    expected: 1
    failure_example: 0
- id: show_port_channel_summary
  command: show port-channel summary
  aliases:
  - sh port-channel summary
  definition: packs/cisco_nxos/commands/show_port_channel_summary.yaml
  result_paths:
