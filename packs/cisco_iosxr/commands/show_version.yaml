apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_version
  title: Cisco IOS XR — show version
  description: Deterministic synthetic, vendor-shaped response for show version on Cisco IOS XR; not captured output.
  license: Apache-2.0
  synthetic: true
  category: system_version
spec:
  platform: cisco_iosxr
  platform_aliases:
  - iosxr
  - ios-xr
  - cisco-ios-xr
  command: show version
  aliases:
  - sh version
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show version
    os_version:
      source: inventory.system.os_version
    image:
      source: inventory.system.image
    uptime:
      generator:
        name: uptime_human
        source: inventory.system.uptime_seconds
    oper_state:
      source: inventory.system.oper_state
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    RP/0/RP0/CPU0:${hostname}#${command}
    ${records}
    Software version: ${os_version}
    System image file: ${image}
    System uptime: ${uptime}
    Operating state: ${oper_state}
  result_schema:
  - path: system.os_version
    type: string
    source: inventory.system.os_version
  - path: system.image
    type: string
    source: inventory.system.image
  - path: system.uptime_seconds
    type: integer
    source: inventory.system.uptime_seconds
  - path: system.oper_state
    type: string
    source: inventory.system.oper_state
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-cisco-iosxr-01
      system:
        os_version: 24.2.1-open
        image: open-iosxr-package.x86_64
        uptime_seconds: 987654
        oper_state: up
      display:
        records:
        - Cisco IOS XR Software, Version synthetic
        - Copyright (c) OpenNV synthetic fixture authors
        - 'Build Information:'
        - ' Built By     : opennv-build'
        - ' Build Host   : fixture-builder'
    expected_output: |
      RP/0/RP0/CPU0:demo-cisco-iosxr-01#show version
      Cisco IOS XR Software, Version synthetic
      Copyright (c) OpenNV synthetic fixture authors
      Build Information:
       Built By     : opennv-build
       Build Host   : fixture-builder
      Software version: 24.2.1-open
      System image file: open-iosxr-package.x86_64
      System uptime: 11d 10:20:54
      Operating state: up
    expected_result:
      system:
        os_version: 24.2.1-open
        image: open-iosxr-package.x86_64
        uptime_seconds: 987654
        oper_state: up
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-cisco-iosxr-01
      system:
        os_version: 24.2.1-open
        image: open-iosxr-package.x86_64
        uptime_seconds: 987654
        oper_state: down
      display:
        records:
        - Cisco IOS XR Software, Version synthetic
        - Copyright (c) OpenNV synthetic fixture authors
        - 'Build Information:'
        - ' Built By     : opennv-build'
        - ' Build Host   : fixture-builder'
    expected_output: |
      RP/0/RP0/CPU0:demo-cisco-iosxr-01#show version
      Cisco IOS XR Software, Version synthetic
      Copyright (c) OpenNV synthetic fixture authors
      Build Information:
       Built By     : opennv-build
       Build Host   : fixture-builder
      Software version: 24.2.1-open
      System image file: open-iosxr-package.x86_64
      System uptime: 11d 10:20:54
      Operating state: down
    expected_result:
      system:
        os_version: 24.2.1-open
        image: open-iosxr-package.x86_64
        uptime_seconds: 987654
        oper_state: down
