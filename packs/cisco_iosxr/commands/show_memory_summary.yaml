apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_memory_summary
  title: Cisco IOS XR — show memory summary
  description: Deterministic synthetic, vendor-shaped response for show memory summary on Cisco IOS XR; not captured
    output.
  license: Apache-2.0
  synthetic: true
  category: memory
spec:
  platform: cisco_iosxr
  platform_aliases:
  - iosxr
  - ios-xr
  - cisco-ios-xr
  command: show memory summary
  aliases:
  - sh memory summary
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show memory summary
    memory:
      generator:
        name: percent
        source: inventory.resources.memory_used_pct
        precision: 1
    free_mb:
      source: inventory.resources.memory_free_mb
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    RP/0/RP0/CPU0:${hostname}#${command}
    ${records}
    Memory used: ${memory}
    Memory free: ${free_mb} MB
  result_schema:
  - path: resources.memory_used_pct
    type: number
    source: inventory.resources.memory_used_pct
  - path: resources.memory_free_mb
    type: integer
    source: inventory.resources.memory_free_mb
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-cisco-iosxr-01
      resources:
        memory_used_pct: 48.7
        memory_free_mb: 4096
      display:
        records:
        - 'Physical Memory: 8192M total'
        - 'Application Memory: 7168M total'
        - 'Image: 1024M, Reserved: 512M, Allocated: 3990M, Free: 4096M'
        - 'Memory utilization: 48.7%'
        - 'Top consumers: fib_mgr 512M, bgp 384M, ospf 128M'
    expected_output: |
      RP/0/RP0/CPU0:demo-cisco-iosxr-01#show memory summary
      Physical Memory: 8192M total
      Application Memory: 7168M total
      Image: 1024M, Reserved: 512M, Allocated: 3990M, Free: 4096M
      Memory utilization: 48.7%
      Top consumers: fib_mgr 512M, bgp 384M, ospf 128M
      Memory used: 48.7%
      Memory free: 4096 MB
    expected_result:
      resources:
        memory_used_pct: 48.7
        memory_free_mb: 4096
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-cisco-iosxr-01
      resources:
        memory_used_pct: 97.0
        memory_free_mb: 128
      display:
        records:
        - 'Physical Memory: 8192M total'
        - 'Application Memory: 7168M total'
        - 'Image: 1024M, Reserved: 512M, Allocated: 8064M, Free: 128M'
        - 'Memory utilization: 97.0%'
        - 'Top consumers: fib_mgr 512M, bgp 384M, ospf 128M'
    expected_output: |
      RP/0/RP0/CPU0:demo-cisco-iosxr-01#show memory summary
      Physical Memory: 8192M total
      Application Memory: 7168M total
      Image: 1024M, Reserved: 512M, Allocated: 8064M, Free: 128M
      Memory utilization: 97.0%
      Top consumers: fib_mgr 512M, bgp 384M, ospf 128M
      Memory used: 97.0%
      Memory free: 128 MB
    expected_result:
      resources:
        memory_used_pct: 97.0
        memory_free_mb: 128
