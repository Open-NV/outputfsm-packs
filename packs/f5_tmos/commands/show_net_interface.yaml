apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_net_interface
  title: F5 BIG-IP TMOS — show net interface
  description: Deterministic synthetic, vendor-shaped response for show net interface on F5 BIG-IP TMOS; not captured
    output.
  license: Apache-2.0
  synthetic: true
  category: interface_summary
spec:
  platform: f5_tmos
  platform_aliases:
  - f5
  - bigip
  - big-ip
  - tmos
  command: show net interface
  aliases:
  - sh net interface
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show net interface
    total:
      source: inventory.interfaces.total
    up:
      source: inventory.interfaces.up
    down:
      source: inventory.interfaces.down
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}(active)(/Common)(tmos)# ${command}
    Net::Interface
    Name       Admin   Status    Speed  Duplex  Flow Ctrl
    ${records}
    Summary: ${total} interfaces, ${up} up, ${down} down
  result_schema:
  - path: interfaces.total
    type: integer
    source: inventory.interfaces.total
  - path: interfaces.up
    type: integer
    source: inventory.interfaces.up
  - path: interfaces.down
    type: integer
    source: inventory.interfaces.down
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-f5-tmos-01
      interfaces:
        total: 48
        up: 47
        down: 1
      display:
        records:
        - 1.1        up      up        10000  full    none
        - 1.2        up      up        10000  full    none
        - mgmt       up      up         1000  full    none
        - 2.1        up      up        25000  full    none
    expected_output: |
      demo-f5-tmos-01(active)(/Common)(tmos)# show net interface
      Net::Interface
      Name       Admin   Status    Speed  Duplex  Flow Ctrl
      1.1        up      up        10000  full    none
      1.2        up      up        10000  full    none
      mgmt       up      up         1000  full    none
      2.1        up      up        25000  full    none
      Summary: 48 interfaces, 47 up, 1 down
    expected_result:
      interfaces:
        total: 48
        up: 47
        down: 1
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-f5-tmos-01
      interfaces:
        total: 48
        up: 42
        down: 6
      display:
        records:
        - 1.1        up      up        10000  full    none
        - 1.2        up      down      10000  full    none
        - mgmt       up      up         1000  full    none
        - 2.1        up      up        25000  full    none
    expected_output: |
      demo-f5-tmos-01(active)(/Common)(tmos)# show net interface
      Net::Interface
      Name       Admin   Status    Speed  Duplex  Flow Ctrl
      1.1        up      up        10000  full    none
      1.2        up      down      10000  full    none
      mgmt       up      up         1000  full    none
      2.1        up      up        25000  full    none
      Summary: 48 interfaces, 42 up, 6 down
    expected_result:
      interfaces:
        total: 48
        up: 42
        down: 6
