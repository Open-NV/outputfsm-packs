apiVersion: opennv.io/v1alpha1
kind: OutputFSM
metadata:
  id: show_sys_clock
  title: F5 BIG-IP TMOS — show sys clock
  description: Deterministic synthetic, vendor-shaped response for show sys clock on F5 BIG-IP TMOS; not captured
    output.
  license: Apache-2.0
  synthetic: true
  category: clock
spec:
  platform: f5_tmos
  platform_aliases:
  - f5
  - bigip
  - big-ip
  - tmos
  command: show sys clock
  aliases:
  - sh sys clock
  variables:
    hostname:
      source: inventory.hostname
    command:
      literal: show sys clock
    clock:
      source: inventory.clock.iso8601
    synced:
      generator:
        name: yes_no
        source: inventory.clock.synced
    offset:
      source: inventory.clock.offset_ms
    records:
      generator:
        name: join
        source: inventory.display.records
        separator: |2+

  template: |
    ${hostname}(active)(/Common)(tmos)# ${command}
    ${records}
    Current time: ${clock}
    Synchronized: ${synced}
    Offset: ${offset} ms
  result_schema:
  - path: clock.iso8601
    type: string
    source: inventory.clock.iso8601
  - path: clock.synced
    type: boolean
    source: inventory.clock.synced
  - path: clock.offset_ms
    type: number
    source: inventory.clock.offset_ms
  fixtures:
  - name: healthy
    description: Synthetic deterministic healthy baseline with representative records; not captured from vendor
      equipment.
    inventory:
      hostname: demo-f5-tmos-01
      clock:
        iso8601: '2026-08-16T07:00:00Z'
        synced: true
        offset_ms: 1.4
      display:
        records:
        - Time source is NTP
        - 'Clock state: synchronized'
        - 'Reference clock: 192.0.2.123'
        - 'Reference status: reachable'
        - 'Timezone: UTC (offset 0 seconds)'
    expected_output: |
      demo-f5-tmos-01(active)(/Common)(tmos)# show sys clock
      Time source is NTP
      Clock state: synchronized
      Reference clock: 192.0.2.123
      Reference status: reachable
      Timezone: UTC (offset 0 seconds)
      Current time: 2026-08-16T07:00:00Z
      Synchronized: yes
      Offset: 1.4 ms
    expected_result:
      clock:
        iso8601: '2026-08-16T07:00:00Z'
        synced: true
        offset_ms: 1.4
  - name: degraded
    description: Synthetic deterministic degraded scenario designed to fail the catalog validation hint; not captured
      from vendor equipment.
    inventory:
      hostname: demo-f5-tmos-01
      clock:
        iso8601: '2026-08-16T07:00:00Z'
        synced: false
        offset_ms: 1802.0
      display:
        records:
        - Time source is NTP
        - 'Clock state: unsynchronized'
        - 'Reference clock: 192.0.2.123'
        - 'Reference status: unreachable'
        - 'Timezone: UTC (offset 0 seconds)'
    expected_output: |
      demo-f5-tmos-01(active)(/Common)(tmos)# show sys clock
      Time source is NTP
      Clock state: unsynchronized
      Reference clock: 192.0.2.123
      Reference status: unreachable
      Timezone: UTC (offset 0 seconds)
      Current time: 2026-08-16T07:00:00Z
      Synchronized: no
      Offset: 1802.0 ms
    expected_result:
      clock:
        iso8601: '2026-08-16T07:00:00Z'
        synced: false
        offset_ms: 1802.0
